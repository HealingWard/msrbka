name: Deploy to GitHub Pages

# Собирает сайт и публикует dist/ в ветку gh-pages — GitHub Pages раздаёт её как сайт.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm ci && npm test
        working-directory: server
      - run: npm run build
      - name: Pack Chrome extension
        run: |
          mkdir -p /tmp/ext && cp -r extension /tmp/ext/pricel-extension
          (cd /tmp/ext && zip -qr "$GITHUB_WORKSPACE/dist/pricel-extension.zip" pricel-extension)
      - run: touch dist/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          commit_message: 'Deploy ${{ github.sha }}'
